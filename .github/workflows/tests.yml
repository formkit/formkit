name: Tests
on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master
      - release/*
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build all

      - name: Run Vitest
        run: pnpm test

      - name: Run React tests against React 18 (production mode)
        # React 18 StrictMode (dev) still creates throwaway nodes (#1784), so
        # this job renders without StrictMode to guard React 18 production.
        env:
          FORMKIT_TEST_NO_STRICT: '1'
        run: |
          npm ci --prefix .tests/react18 --no-audit --no-fund
          pnpm vitest run -c vitest.react18.config.mts

      - name: Run Typecheck
        run: pnpm vitest --typecheck.only --run

      - name: Run Playwright
        run: pnpm run playwright

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
